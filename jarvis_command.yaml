schema_version: 1
name: get_crypto_price
display_name: Crypto Price
description: Gets the current price of a cryptocurrency from CoinGecko's free API, defaulting to USD.
version: 0.1.0
author:
  github: community
keywords:
  - crypto
  - cryptocurrency
  - bitcoin
  - ethereum
  - coin
  - price
  - btc
  - eth
  - coingecko
categories:
  - finance
  - information
platforms: []
parameters:
  - name: coin
    type: string
    required: true
    description: Name or ticker of the cryptocurrency, e.g. Bitcoin, Ethereum, BTC, Solana
  - name: currency
    type: string
    required: false
    description: Currency to quote the price in, e.g. USD, euros, pounds. Defaults to USD.
    default: usd
secrets: []
packages:
  - name: requests
    version: ">=2.28.0"
min_jarvis_version: "0.9.0"
license: MIT
